version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: sv_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shortvideo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sv_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sv_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG: "true"
      SERVE_STORAGE_DIRECT: "true"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shortvideo}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-please-change-me-in-production}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      CORS_ORIGINS: "*"
      UPLOAD_DIR: /app/storage/uploads
      ASSETS_DIR: /app/storage/assets
    volumes:
      - ./storage:/app/storage
    expose:
      - "8000"
    ports:
      - "8000:8000"
    # entrypoint.sh runs `alembic upgrade head` then exec uvicorn.
    # Worker (below) does NOT run migrations; only one container should.
    command: ["./entrypoint.sh"]

  worker:
    build:
      context: ./backend
    container_name: sv_worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shortvideo}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-please-change-me-in-production}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      UPLOAD_DIR: /app/storage/uploads
      ASSETS_DIR: /app/storage/assets
    volumes:
      - ./storage:/app/storage
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]

  frontend:
    build:
      context: ./frontend
    container_name: sv_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: ""
      # Empty -> frontend uses relative /api/* which Nginx routes to backend.
      # If you run frontend WITHOUT nginx, set this to http://localhost:8000
    expose:
      - "3000"
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: sv_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage:/srv/storage:ro

volumes:
  pgdata:
  redisdata:
