# =============================================================
# Production nginx config
# - No direct /storage/ exposure; all asset access goes through
#   /api/assets/{id}/download which enforces auth + permission.
# - Security headers added.
# - client_max_body_size kept small enough to make accidental
#   large uploads obvious; raise if your novels are huge.
# =============================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # If you serve over HTTPS via Cloudflare/etc, also enable:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ---- /storage/ is intentionally NOT served in prod ----
    # Any leaked URL like https://example.com/storage/uploads/foo.txt
    # will return 404. Real downloads go through /api/assets/.../download.
    location /storage/ {
        return 404;
    }

    # ---- API -> FastAPI backend ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # File downloads can be large; disable buffering so the client gets
        # bytes as the backend streams them.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---- Backend Swagger docs ----
    # Hidden by default in production. Operators who need them for live
    # debugging can comment-out these `return 404;` lines and replace with
    # the proxy_pass block below.
    location = /docs {
        return 404;
    }
    location = /openapi.json {
        return 404;
    }
    # --- to TEMPORARILY enable, comment the two `return 404` blocks above
    #     and uncomment the two blocks below: ---
    # location /docs {
    #     proxy_pass http://backend:8000/docs;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    # }
    # location /openapi.json {
    #     proxy_pass http://backend:8000/openapi.json;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    # }

    # ---- Everything else -> Next.js frontend ----
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
