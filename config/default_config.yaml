# ============================================================================
#  FPS 多模态态势感知系统 —— 默认配置文件 (default_config.yaml)
#  说明：本文件支持热重载（Hot-reload）。修改并保存后，运行中的系统会
#        自动感知变更并刷新内存中的配置，无需重启进程。
# ============================================================================

# ---------------------------------------------------------------------------
# 音频提取模块 (Audio)
#   负责实时采集与处理游戏音频流，用于枪声 / 脚步声等声学事件检测。
# ---------------------------------------------------------------------------
audio:
  sample_rate: 48000        # 采样率 (Hz)，需与声卡环回设备保持一致
  channels: 2               # 声道数，2 为立体声（用于声源方位判断）
  chunk_size: 1024          # 单次读取的帧数（缓冲区块大小），影响延迟与吞吐
  energy_threshold: 0.015   # VAD 触发的 RMS 能量阈值，低于该值视为静音 (0.0 ~ 1.0)
  vad_threshold: 0.6        # 活动检测置信度阈值（预留给后续模型 VAD）(0.0 ~ 1.0)
  vad_start_chunks: 3       # 连续多少个高能量 chunk 判定"声音事件开始"
  vad_silence_duration_ms: 300.0  # 能量回落后持续多久静音判定"事件结束"(毫秒)

# ---------------------------------------------------------------------------
# 计算机视觉模块 (CV)
#   负责屏幕捕获与小地图坐标识别。
# ---------------------------------------------------------------------------
cv:
  fps_limit: 30             # 视觉处理帧率上限，防止 CPU/GPU 过载
  roi_bbox:                 # 感兴趣区域（小地图）在全屏中的像素偏移与尺寸
    x: 40                   #   左上角横坐标偏移 (px)
    y: 40                   #   左上角纵坐标偏移 (px)
    w: 320                  #   区域宽度 (px)
    h: 320                  #   区域高度 (px)

# ---------------------------------------------------------------------------
# 多模态融合模块 (Fusion)
#   将音频方位、视觉坐标与 3D 点云碰撞约束进行时空对齐与融合。
# ---------------------------------------------------------------------------
fusion:
  tolerance_radius_meters: 1.5   # 融合容差半径 (米)，跨模态目标关联的空间阈值
  min_confidence: 0.85           # 融合结果的最小可信度，低于此值的目标将被丢弃
