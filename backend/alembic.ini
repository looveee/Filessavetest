# Alembic Config File for AI Short-Video Platform.
#
# We deliberately leave sqlalchemy.url EMPTY here — the actual URL is
# loaded at runtime from app.config.settings.DATABASE_URL inside env.py.
# This avoids storing credentials in the repo and keeps a single source
# of truth (the .env / compose environment).

[alembic]
script_location = alembic

# template used to generate migration files (default mako)
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use the project's working dir, not script_location
prepend_sys_path = .

# Path separator used by file_template
path_separator = os

# UTC timestamps in migration filenames
timezone = UTC

# Leave blank — env.py provides the URL from app settings.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
